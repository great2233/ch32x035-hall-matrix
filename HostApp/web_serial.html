<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8x8 霍尔矩阵 · Web Serial 上位机</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --line:#2a3450;
    --fg:#e6ecf5; --dim:#8b97b4; --acc:#3b82f6; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{min-height:100%;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:14px; display:flex; flex-direction:column; align-items:center;
  }
  header{width:100%; max-width:760px; padding:18px 20px 10px; text-align:center;}
  header h1{font-size:20px; font-weight:600; letter-spacing:.5px;}
  #connBar{margin-top:8px; display:inline-flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:5px 16px; color:var(--dim); font-size:13px;}
  #connDot{width:9px;height:9px;border-radius:50%;background:var(--err);}
  #connDot.on{background:var(--ok); box-shadow:0 0 8px var(--ok);}
  #connLabel{color:var(--fg);}

  main{width:100%; max-width:760px; flex:1; display:flex; flex-direction:column;
    gap:14px; padding:10px 20px 24px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .card h2{font-size:14px; color:var(--acc); margin-bottom:12px;
    border-left:3px solid var(--acc); padding-left:8px;}

  /* 热力图 */
  #viewCard{display:flex; flex-direction:column; align-items:center;}
  #viewRow{display:flex; align-items:center; gap:16px; justify-content:center; width:100%;}
  #heatWrap{flex:1; max-width:480px;}
  #heatCanvas{width:100%; aspect-ratio:1; background:#0a0e18; border-radius:8px;
    border:1px solid var(--line); display:block;}
  #barCol{display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:12px; color:var(--dim);}
  #barCanvas{width:18px; height:240px; border-radius:4px; background:#0a0e18;
    border:1px solid var(--line);}
  #stats{display:flex; gap:28px; margin-top:12px; color:var(--dim); font-size:13px;}
  #stats b{color:var(--fg); font-weight:600;}

  /* 串口 */
  #serialCard{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  #serialCard label{color:var(--dim);}
  button{background:var(--acc); color:#fff; border:none; border-radius:6px;
    padding:8px 18px; cursor:pointer; font-size:13px;}
  button:hover{filter:brightness(1.15);}
  button:disabled{background:#3a4a66; cursor:not-allowed;}
  button.secondary{background:var(--panel2); border:1px solid var(--line); color:var(--fg);}

  /* 参数 */
  .param-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 24px;}
  .param-row{display:flex; align-items:center; gap:10px;}
  .param-row .pname{width:84px; color:var(--dim); font-size:13px; flex:none;}
  .param-row input[type=range]{flex:1; min-width:80px; accent-color:var(--acc);}
  .param-row .val{width:60px; text-align:right; background:var(--panel2);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; color:var(--fg);
    font-size:13px; flex:none;}
  .param-row .unit{width:26px; color:var(--dim); font-size:12px; flex:none;}
  .checks{display:flex; gap:20px; margin-top:14px;}
  .checks label{display:flex; align-items:center; gap:6px; color:var(--dim); cursor:pointer;}
  .checks input{accent-color:var(--acc);}

  /* 命令 + 日志 */
  #cmdCard{display:flex; align-items:center; gap:10px;}
  #cmdCard input{flex:1; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; outline:none;}
  #log{background:#0a0e18; border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; height:110px; overflow-y:auto;
    font-family:Consolas,"Courier New",monospace; font-size:12.5px;
    line-height:1.6; color:#9fb2d0; white-space:pre-wrap;}

  #banner{background:#3a2a1c; border:1px solid #8a5a2a; color:#ffd59a;
    border-radius:8px; padding:8px 12px; font-size:13px; display:none;}
</style>
</head>
<body>
<header>
  <h1>8x8 霍尔矩阵 · 磁场强度可视化</h1>
  <div id="connBar">
    <span id="connDot"></span>
    <span>状态:</span><span id="connLabel">未连接</span>
  </div>
</header>

<main>
  <div id="banner"></div>

  <!-- 热力图 -->
  <div class="card" id="viewCard">
    <div id="viewRow">
      <div id="heatWrap"><canvas id="heatCanvas"></canvas></div>
      <div id="barCol">
        <span id="barMax">--</span>
        <canvas id="barCanvas" width="18" height="240"></canvas>
        <span id="barMin">--</span>
      </div>
    </div>
    <div id="stats">
      <span>帧: <b id="stFrame">0</b></span>
      <span>速率: <b id="stRate">0.0 Hz</b></span>
      <span>范围: <b id="stRange">--</b></span>
    </div>
  </div>

  <!-- 串口 -->
  <div class="card" id="serialCard">
    <label>波特率:</label><span>115200</span>
    <button id="btnConnect" onclick="toggleConnect()">连接串口</button>
    <span style="color:var(--dim);font-size:12px;">点击连接后在弹出的系统窗口中选择设备（USB 虚拟串口）</span>
  </div>

  <!-- 参数 -->
  <div class="card" id="paramCard">
    <h2>运行参数（串口指令调节）</h2>
    <div class="param-grid">
      <div class="param-row">
        <span class="pname">扫描周期</span>
        <input type="range" id="slInterval" min="50" max="5000" step="10" value="300">
        <input type="number" class="val" id="vInterval" value="300">
        <span class="unit">ms</span>
        <button onclick="applyParam('interval', valOf('vInterval'))">应用</button>
      </div>
      <div class="param-row">
        <span class="pname">采样平均</span>
        <input type="range" id="slSamples" min="1" max="16" step="1" value="4">
        <input type="number" class="val" id="vSamples" value="4">
        <span class="unit">次</span>
        <button onclick="applyParam('samples', valOf('vSamples'))">应用</button>
      </div>
      <div class="param-row">
        <span class="pname">行稳定延时</span>
        <input type="range" id="slRowDelay" min="10" max="1000" step="10" value="100">
        <input type="number" class="val" id="vRowDelay" value="100">
        <span class="unit">us</span>
        <button onclick="applyParam('row_delay', valOf('vRowDelay'))">应用</button>
      </div>
      <div class="param-row">
        <span class="pname">行关闭延时</span>
        <input type="range" id="slCloseDelay" min="10" max="500" step="10" value="50">
        <input type="number" class="val" id="vCloseDelay" value="50">
        <span class="unit">us</span>
        <button onclick="applyParam('close_delay', valOf('vCloseDelay'))">应用</button>
      </div>
      <div class="param-row">
        <span class="pname">温漂使能</span>
        <select id="selTempEn" style="flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;outline:none;">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
        <span class="unit"></span>
        <button onclick="applyParam('temp_en', $('selTempEn').value)">应用</button>
      </div>
      <div class="param-row">
        <span class="pname">温漂系数</span>
        <input type="range" id="slTempCoeff" min="-1000" max="1000" step="10" value="0">
        <input type="number" class="val" id="vTempCoeff" value="0">
        <span class="unit"></span>
        <button onclick="applyParam('temp_coeff', valOf('vTempCoeff'))">应用</button>
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="chkAuto" checked> 自动范围</label>
      <label><input type="checkbox" id="chkVal" checked> 显示数值</label>
      <label>显示:
        <select id="selUnit" style="background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;outline:none;">
          <option value="adc">原始值 (ADC)</option>
          <option value="cal">校准后 (ADC)</option>
          <option value="gauss">校准后 高斯 (G)</option>
        </select>
      </label>
    </div>
  </div>

  <!-- 命令 -->
  <div class="card" id="cmdCard">
    <label style="color:var(--dim)">命令:</label>
    <input id="cmdInput" placeholder="hall / field / status / help / param set interval 200" disabled>
    <button onclick="calZero()" disabled id="btnCal">零磁场校准</button>
    <button onclick="sendText('field')" disabled id="btnField">磁场强度</button>
    <button onclick="sendText('hall')" disabled id="btnHall">原始ADC</button>
    <button id="btnSend" onclick="sendCmd()" disabled>发送</button>
  </div>

  <!-- 日志 -->
  <div class="card" id="statusCard">
    <h2>运行日志</h2>
    <div id="log"></div>
  </div>
</main>

<script>
"use strict";
/* ================= 双色渐变（蓝 -> 红） ================= */
const COL_LO = [0x1F, 0x63, 0xFF];
const COL_HI = [0xFF, 0x1F, 0x1F];
function grad(t){
  t = Math.max(0, Math.min(1, t));
  return [
    Math.round(COL_LO[0] + t * (COL_HI[0] - COL_LO[0])),
    Math.round(COL_LO[1] + t * (COL_HI[1] - COL_LO[1])),
    Math.round(COL_LO[2] + t * (COL_HI[2] - COL_LO[2])),
  ];
}
function rgbStr(c){ return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }

/* ================= 全局状态 ================= */
const $ = id => document.getElementById(id);
let matrix = Array.from({length:8}, () => Array(8).fill(0));
let vmin = 0, vmax = 4095;
let connected = false;
let port = null, reader = null;
let textBuf = "";
let frameCount = 0, rateStart = Date.now(), rateHz = 0;
let writeChain = Promise.resolve();
let fieldZero = 2048, fieldK = 872;   // SS49E 磁场换算参数（来自固件回显）
let g_cal = Array(64).fill(0);        // 逐点零场校准表（来自固件 cal 回显）
let lastDataTs = 0;                   // 最近一次收到矩阵数据的时间
let lastByteTs = 0;                   // 最近一次收到任意字节的时间
let warnShown = false;

/* ================= 高清 Canvas ================= */
function prepCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300;
  const h = cv.clientHeight || w;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

/* ================= Web Serial ================= */
if(!("serial" in navigator)){
  const b = $("banner");
  b.style.display = "block";
  b.textContent = "当前浏览器不支持 Web Serial API。请使用 Chrome / Edge 浏览器打开本页面（双击本 HTML 即可）。";
  $("btnConnect").disabled = true;
}

async function toggleConnect(){
  if(connected){ await disconnect(); }
  else{ await connect(); }
}

async function connect(){
  let portSel = null;
  try{
    portSel = await navigator.serial.requestPort();
  }catch(e){
    if(e && e.name === "NotFoundError"){ log("未选择串口"); }
    else log("选择串口失败: " + e);
    return;
  }

  // open 失败自动重试（端口释放需要时间 / 可能被占用）
  let opened = false;
  for(let i = 1; i <= 3; i++){
    try{
      await portSel.open({ baudRate: 115200, bufferSize: 4096 });
      opened = true;
      break;
    }catch(e){
      log("打开端口失败(第" + i + "次): " + e);
      if(i < 3) await new Promise(r => setTimeout(r, 800));
    }
  }
  if(!opened){
    log("打开串口失败。请检查：1) 端口是否被其他程序(串口助手/Python上位机)占用 2) USB 是否稳定");
    try{ portSel.close(); }catch(_){}
    return;
  }

  port = portSel;
  connected = true;
  textBuf = "";
  frameCount = 0; rateStart = Date.now();
  lastByteTs = lastDataTs = Date.now();
  updateConnUI();
  log("已连接串口");
  readLoop();
  sendText("param");   // 请求参数列表回显
  sendText("cal");     // 请求校准表
}

async function disconnect(){
  connected = false;
  try{ if(reader) await reader.cancel(); }catch(e){}
  try{ reader = null; }catch(e){}
  try{ if(port) await port.close(); }catch(e){}
  port = null;
  updateConnUI();
  log("已断开");
}

async function readLoop(){
  while(connected && port){
    try{
      if(!reader) reader = port.readable.getReader();
      const { value, done } = await reader.read();
      if(done){
        try{ reader.releaseLock(); }catch(_){}
        reader = null;
        continue;
      }
      lastByteTs = Date.now();
      if(value){
        textBuf += new TextDecoder("latin1").decode(value);
        consume();
      }
    }catch(e){
      if(!connected) break;
      log("读取异常，正在恢复读取流...");
      try{ reader && reader.releaseLock(); }catch(_){}
      reader = null;
      lastByteTs = Date.now();
      await new Promise(r => setTimeout(r, 300));
    }
  }
}

// 接收看门狗：超过 5 秒无任何字节则重置读取流
setInterval(() => {
  if(connected && Date.now() - lastByteTs > 5000){
    log("接收超时，正在重置读取流...");
    try{ reader && reader.releaseLock(); }catch(_){}
    reader = null;
    lastByteTs = Date.now();
  }
}, 2000);

function updateConnUI(){
  const on = connected;
  $("connDot").classList.toggle("on", on);
  $("connLabel").textContent = on ? "已连接" : "未连接";
  $("btnConnect").textContent = on ? "断开" : "连接串口";
  $("cmdInput").disabled = !on;
  $("btnSend").disabled = !on;
  $("btnField").disabled = !on;
  $("btnHall").disabled = !on;
  $("btnCal").disabled = !on;
}

/* ================= 发送（串行队列） ================= */
function sendText(txt){
  if(!port || !connected) return;
  const data = new TextEncoder().encode(txt + "\r\n");
  writeChain = writeChain.then(async () => {
    if(!port || !connected) return;
    const w = await port.writable.getWriter();
    try{ await w.write(data); }finally{ w.releaseLock(); }
  }).catch(e => log("发送失败: " + e));
}

function sendCmd(){
  const v = $("cmdInput").value.trim();
  if(!v) return;
  sendText(v);
  $("cmdInput").value = "";
}

// 零磁场校准：确保无磁场后执行，稍后重新获取校准表
function calZero(){
  if(!connected){ log("未连接，无法校准"); return; }
  log("零磁场校准中... 请保持矩阵区域无磁场");
  sendText("cal_zero");
  setTimeout(() => { sendText("cal"); log("已重新获取校准表"); }, 1500);
}

/* ================= 协议解析（健壮版：完整块优先，不完整不阻塞） ================= */
const START_MARK = "=== Hall Matrix";
const PARAMS_MARK = "--- Params ---";
const FIELD_MARK = "=== Field Matrix";
const CAL_MARK = "=== Cal Table";

// 从 start 起找到第一个完整块（标记行 + 内容 + 分隔线），返回 {body, end} 或 null
function tryBlock(text, start){
  const nl = text.indexOf("\n", start);
  if(nl < 0) return null;                     // 标记行未完整
  const rest = text.slice(nl + 1);
  const mm = rest.match(/\r?\n=+\r?\n/);
  if(!mm) return null;                        // 分隔线未到，块不完整
  const end = nl + 1 + mm.index + mm[0].length;
  return { body: text.slice(start, end), end };
}

// 解析矩阵帧，返回 {matrix, end} 或 null
function tryFrame(text, start){
  const blk = tryBlock(text, start);
  if(!blk) return null;
  const rows = [];
  blk.body.split("\r\n").forEach(l => {
    const t = l.trim();
    if(!t) return;
    const nums = t.split(/\s+/).map(Number);
    if(nums.length === 8 && nums.every(n => Number.isFinite(n))) rows.push(nums);
  });
  if(rows.length < 8) return null;
  return { matrix: rows.slice(0, 8), end: blk.end };
}

// 解析参数块，返回 {params, end} 或 null
function tryParams(text, start){
  const after = text.slice(start + PARAMS_MARK.length);
  let bound = after.length;
  for(const m of [START_MARK, CAL_MARK, FIELD_MARK]){
    const i = after.indexOf(m);
    if(i >= 0) bound = Math.min(bound, i);
  }
  const i0 = after.indexOf("\r\n\r\n");
  if(i0 >= 0) bound = Math.min(bound, i0);
  const params = {};
  let matched = false;
  after.slice(0, bound).split("\r\n").forEach(line => {
    const m = line.trim().match(/^([a-z_]+)\s*=\s*(\d+)\s*$/);
    if(m){ params[m[1]] = parseInt(m[2], 10); matched = true; }
  });
  if(!matched) return null;
  return { params, end: start + PARAMS_MARK.length + bound };
}

// 解析校准表，返回 {rows8x8, end} 或 null
function tryCal(text, start){
  const blk = tryBlock(text, start);
  if(!blk) return null;
  const rows = [];
  blk.body.split("\r\n").forEach(l => {
    const t = l.trim();
    if(!t) return;
    const nums = t.split(/\s+/).map(Number);
    if(nums.length === 8 && nums.every(n => Number.isFinite(n))) rows.push(nums);
  });
  if(rows.length < 8) return null;
  return { rows: rows.slice(0, 8), end: blk.end };
}

function consume(){
  let guard = 0;
  while(guard++ < 64 && textBuf.length){
    // 1) 矩阵帧（最高优先级，避免被其他不完整块阻塞）
    const fi = textBuf.indexOf(START_MARK);
    if(fi >= 0){
      const fr = tryFrame(textBuf, fi);
      if(fr){
        onMatrix(fr.matrix);
        textBuf = textBuf.slice(0, fi) + textBuf.slice(fr.end);
        continue;
      }
    }
    // 2) 校准表
    const ci = textBuf.indexOf(CAL_MARK);
    if(ci >= 0){
      const cr = tryCal(textBuf, ci);
      if(cr){
        for(let r = 0; r < 8; r++)
          for(let c = 0; c < 8; c++)
            g_cal[r * 8 + c] = cr.rows[r][c];
        log("校准表已更新 (64 点)");
        textBuf = textBuf.slice(0, ci) + textBuf.slice(cr.end);
        continue;
      }
    }
    // 3) field 回显（显示到日志）
    const di = textBuf.indexOf(FIELD_MARK);
    if(di >= 0){
      const dr = tryBlock(textBuf, di);
      if(dr){
        const lines = [];
        dr.body.split("\r\n").forEach(l => {
          const t = l.trim();
          if(t && t.indexOf("Field") < 0) lines.push(t);
        });
        log("磁场强度 (G):\n" + lines.join("\n"));
        textBuf = textBuf.slice(0, di) + textBuf.slice(dr.end);
        continue;
      }
    }
    // 4) 参数块
    const pi = textBuf.indexOf(PARAMS_MARK);
    if(pi >= 0){
      const pr = tryParams(textBuf, pi);
      if(pr){
        onParams(pr.params);
        textBuf = textBuf.slice(0, pi) + textBuf.slice(pr.end);
        continue;
      }
    }

    // 无可消费的完整块：清理
    const keep = Math.max(START_MARK.length, PARAMS_MARK.length,
                          FIELD_MARK.length, CAL_MARK.length) - 1;
    if(textBuf.length > 2048) textBuf = textBuf.slice(-keep);
    break;
  }
}

/* ================= 数据回调 ================= */
function onMatrix(m){
  matrix = m;
  lastDataTs = Date.now();
  warnShown = false;
  frameCount++;
  const now = Date.now();
  if(now - rateStart >= 1000){
    rateHz = frameCount * 1000 / (now - rateStart);
    frameCount = 0; rateStart = now;
  }
  $("stFrame").textContent = frameCount;
  $("stRate").textContent = rateHz.toFixed(1) + " Hz";
  draw();
}

// 无数据超时提示（诊断用）
setInterval(() => {
  if(connected && lastDataTs > 0 && Date.now() - lastDataTs > 3000 && !warnShown){
    warnShown = true;
    if(Date.now() - lastByteTs < 3000){
      log("警告：能收到字节但无矩阵帧。请确认下位机已烧录最新固件（发送矩阵）");
    }else{
      log("警告：3 秒未收到数据。请确认下位机已烧录最新固件，或串口/波特率(115200)是否正确");
    }
  }
}, 2000);

function onParams(p){
  if(p.interval != null) setVal("slInterval", "vInterval", p.interval);
  if(p.row_delay != null) setVal("slRowDelay", "vRowDelay", p.row_delay);
  if(p.close_delay != null) setVal("slCloseDelay", "vCloseDelay", p.close_delay);
  if(p.samples != null) setVal("slSamples", "vSamples", p.samples);
  if(p.field_zero != null) fieldZero = p.field_zero;
  if(p.field_k != null) fieldK = p.field_k;
  if(p.temp_en != null) $("selTempEn").value = String(p.temp_en);
  if(p.temp_coeff != null) setVal("slTempCoeff", "vTempCoeff", p.temp_coeff);
}

/* ================= 参数 ================= */
function valOf(id){ return parseInt($(id).value) || 0; }
function bindSlider(slId, vId, applyFn){
  const sl = $(slId), v = $(vId);
  sl.addEventListener("input", () => v.value = sl.value);
  v.addEventListener("change", () => { sl.value = v.value; applyFn(); });
  sl.addEventListener("change", applyFn);
}
function applyParam(name, value){
  if(!connected){ log("未连接，无法设置"); return; }
  sendText("param set " + name + " " + value);
  log("已发送: param set " + name + " = " + value);
}
function setVal(slId, vId, v){
  const sl = $(slId);
  sl.value = Math.max(+sl.min, Math.min(+sl.max, v));
  $(vId).value = sl.value;
}

/* ================= 绘制 ================= */
function selMode(){ return $("selUnit").value; }

// ADC 转显示值：原始 / 校准后(ADC) / 校准后(0.1G)
function toDisplayVal(adc, r, c){
  const mode = selMode();
  if(mode === "adc") return adc;
  const cal = g_cal[r * 8 + c] || 0;
  const v = adc - cal;
  if(mode === "cal") return v;
  return v * fieldK / 100;   // 校准后高斯, 单位 0.1G
}
function fmtGauss(b10){
  const neg = b10 < 0;
  const a = Math.abs(Math.round(b10));
  return (neg ? "-" : "") + Math.floor(a / 10) + "." + (a % 10);
}

function draw(){
  const cv = $("heatCanvas");
  const ctx = prepCanvas(cv);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  const mode = selMode();
  const gauss = mode === "gauss";

  if($("chkAuto").checked){
    let lo = Infinity, hi = -Infinity;
    matrix.forEach((row, r) => row.forEach((v, c) => {
      const d = toDisplayVal(v, r, c);
      if(d < lo) lo = d;
      if(d > hi) hi = d;
    }));
    vmin = lo === Infinity ? 0 : lo;
    vmax = hi === -Infinity ? 1 : hi;
  } else { vmin = 0; vmax = gauss ? 4000 : 4095; }
  if(vmax <= vmin) vmax = vmin + 1;

  const m = 6, gw = W - 2*m, gh = H - 2*m, cw = gw/8, chh = gh/8;
  const showText = $("chkVal").checked && cw >= 40 && chh >= 24;
  if(showText){
    ctx.font = "600 " + Math.min(15, Math.floor(chh * 0.42)) + "px 'Segoe UI','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
  }

  for(let r = 0; r < 8; r++){
    for(let c = 0; c < 8; c++){
      const d = toDisplayVal(matrix[r][c], r, c);
      const t = (d - vmin) / (vmax - vmin);
      ctx.fillStyle = rgbStr(grad(t));
      ctx.fillRect(m + c*cw + 1, m + r*chh + 1, cw - 2, chh - 2);
      if(showText){
        const cx = m + c*cw + cw/2, cy = m + r*chh + chh/2;
        const txt = gauss ? fmtGauss(d) : String(Math.round(d));
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(0,0,0,0.55)";
        ctx.lineWidth = 3;
        ctx.strokeText(txt, cx, cy);
        ctx.fillStyle = t > 0.6 ? "#ffffff" : "#0d1322";
        ctx.fillText(txt, cx, cy);
      }
    }
  }
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i = 0; i <= 8; i++){
    ctx.moveTo(m + i*cw, m); ctx.lineTo(m + i*cw, m + gh);
    ctx.moveTo(m, m + i*chh); ctx.lineTo(m + gw, m + i*chh);
  }
  ctx.stroke();

  // 色条（侧边）
  const bc = $("barCanvas");
  const bw = bc.width, bh = bc.height;
  const bctx = bc.getContext("2d");
  bctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  bctx.clearRect(0, 0, bw, bh);
  for(let i = 0; i < bh; i++){
    bctx.fillStyle = rgbStr(grad(1 - i/(bh-1)));
    bctx.fillRect(0, i, bw, 1);
  }
  const unit = gauss ? "G" : (mode === "adc" ? "ADC" : "校准ADC");
  $("barMax").textContent = gauss ? fmtGauss(vmax) : Math.round(vmax);
  $("barMin").textContent = gauss ? fmtGauss(vmin) : Math.round(vmin);
  $("stRange").textContent = (gauss ? fmtGauss(vmin) : Math.round(vmin)) + " ~ " +
                             (gauss ? fmtGauss(vmax) : Math.round(vmax)) + " " + unit;
}

/* ================= 日志 ================= */
function log(msg){
  const el = $("log");
  el.textContent += (el.textContent ? "\n" : "") +
    new Date().toLocaleTimeString() + " " + msg;
  el.scrollTop = el.scrollHeight;
}

/* ================= 初始化 ================= */
bindSlider("slInterval", "vInterval", () => applyParam("interval", valOf("vInterval")));
bindSlider("slRowDelay", "vRowDelay", () => applyParam("row_delay", valOf("vRowDelay")));
bindSlider("slCloseDelay", "vCloseDelay", () => applyParam("close_delay", valOf("vCloseDelay")));
bindSlider("slSamples", "vSamples", () => applyParam("samples", valOf("vSamples")));
bindSlider("slTempCoeff", "vTempCoeff", () => applyParam("temp_coeff", valOf("vTempCoeff")));
$("selTempEn").addEventListener("change", () => applyParam("temp_en", $("selTempEn").value));
$("chkAuto").addEventListener("change", draw);
$("chkVal").addEventListener("change", draw);
$("selUnit").addEventListener("change", draw);
$("cmdInput").addEventListener("keydown", e => { if(e.key === "Enter") sendCmd(); });
window.addEventListener("resize", draw);

log("就绪：点击“连接串口”，在系统弹窗中选择 USB 虚拟串口");
draw();
</script>
